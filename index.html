<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koçluk Takip</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#16203a;--mut:#64708a;--line:#e3e8f0;--pri:#2f4bd8;--pri2:#e8edff;--ok:#16915c;--warn:#c77a00;--bad:#c93b3b;font-size:clamp(15px,.55vw + 9px,21px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
h1{font-size:1.6rem;margin:0 0 .2rem}h2{font-size:1.05rem;margin:0 0 .8rem}.mut{color:var(--mut)}
button,input,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:.7rem;padding:.6rem 1.1rem;font-weight:600}.btn.g{background:var(--pri2);color:var(--pri)}.btn.d{background:#fdecec;color:var(--bad)}.btn.s{padding:.3rem .7rem;font-size:.85rem}
input,select{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:.7rem;background:#fff}label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:.9rem}label input,label select{margin-top:.25rem;color:var(--ink)}
.shell{display:flex;min-height:100vh}nav{width:15rem;background:#101a3a;color:#c9d2f0;padding:1.4rem 1rem;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:.2rem;z-index:20;transition:transform .2s}
nav b{color:#fff;font-size:1.15rem;padding:0 .7rem 1rem}nav a{color:inherit;text-decoration:none;padding:.65rem .8rem;border-radius:.7rem}nav a.on,nav a:hover{background:#22306b;color:#fff}nav .sp{flex:1}
main{margin-left:15rem;padding:2rem clamp(1rem,3vw,3rem);width:100%;max-width:110rem}.top{display:none}
.card{background:var(--card);border-radius:1rem;padding:1.2rem 1.3rem;box-shadow:0 1px 2px rgba(20,30,60,.05),0 6px 20px rgba(20,30,60,.04)}.card.p{background:var(--pri);color:#fff}
.grid{display:grid;gap:1rem;margin:1rem 0}.g4{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(20rem,1fr))}
.big{font-size:2rem;font-weight:700;line-height:1.1}.row{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mut);font-size:.82rem;padding:.5rem}td{padding:.65rem .5rem;border-top:1px solid var(--line)}tr.l{cursor:pointer}tr.l:hover{background:#f7f9fd}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:2rem;font-size:.78rem;font-weight:600;background:var(--pri2);color:var(--pri)}.tag.done{background:#e3f6ed;color:var(--ok)}.tag.expired{background:#fdecec;color:var(--bad)}.tag.in_progress{background:#fff2d9;color:var(--warn)}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--mut)}.err{background:#fdecec;color:var(--bad);padding:.6rem .8rem;border-radius:.7rem;margin-bottom:1rem}
.auth{max-width:26rem;margin:8vh auto;padding:0 1rem}.tabs{display:flex;gap:.5rem;margin-bottom:1rem}.tabs button{flex:1}
dialog{border:0;border-radius:1rem;padding:1.4rem;width:min(34rem,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(10,15,40,.5)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 .6rem}
.bar{height:.5rem;background:var(--pri2);border-radius:1rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}svg{width:100%;height:auto;display:block}
@media(max-width:900px){nav{transform:translateX(-100%)}nav.open{transform:none}main{margin:0;padding:1rem}.top{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}}
@media(max-width:640px){thead{display:none}tr,td{display:block}tr{border-top:1px solid var(--line);padding:.5rem 0}td{border:0;padding:.15rem 0;display:flex;justify-content:space-between;gap:1rem}td:before{content:attr(data-l);color:var(--mut)}.f2,.f3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');let me,cfg,D=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GEN='Bir hata oluştu. Lütfen tekrar deneyin.';
async function api(p,m='GET',b){let r,j={};try{r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});j=await r.json()}catch{throw new Error(GEN)}if(!r.ok)throw new Error(j.error||GEN);return j}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dt=s=>new Date(s+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
const dur=m=>m>=60?`${Math.floor(m/60)}s${m%60?' '+m%60+'dk':''}`:`${m}dk`;
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},ago=n=>addD(today(),-n);
let rng='day',cache=null,seq=0,lastHash='';
const mon=()=>{const d=new Date(today()+'T12:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toISOString().slice(0,10)};
const ST={pending:'Bekliyor',in_progress:'Devam Ediyor',done:'Tamamlandı',expired:'Süresi Doldu'};
const tag=s=>`<span class="tag ${s}">${ST[s]}</span>`;
const empty=(t,s)=>`<div class="empty"><b>${t}</b><div>${s||''}</div></div>`;
const tbl=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
const tr=(c,h,extra='')=>`<tr ${extra}>${c.map((x,i)=>`<td data-l="${h[i]}">${x}</td>`).join('')}</tr>`;
// ---- grafikler (SVG)
function bars(d,fmt=x=>x){const m=Math.max(1,...d.map(x=>x.v)),w=56;return`<svg viewBox="0 0 ${d.length*w} 150" role="img">${d.map((x,i)=>{const h=x.v/m*100;return`<rect x="${i*w+10}" y="${110-h}" width="${w-20}" height="${h}" rx="6" fill="#2f4bd8" opacity=".9"/><text x="${i*w+w/2}" y="${104-h}" text-anchor="middle" font-size="11" fill="#16203a">${x.v?fmt(x.v):''}</text><text x="${i*w+w/2}" y="132" text-anchor="middle" font-size="11" fill="#64708a">${x.l}</text>`}).join('')}</svg>`}
function line(d){if(!d.length)return empty('Henüz deneme yok');const W=400,H=150,vs=d.map(x=>x.v),mn=Math.min(0,...vs),mx=Math.max(1,...vs),X=i=>d.length<2?W/2:30+i*(W-60)/(d.length-1),Y=v=>120-(v-mn)/(mx-mn||1)*95;
  return`<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="20" x2="${W-10}" y1="120" y2="120" stroke="#e3e8f0"/><polyline fill="none" stroke="#2f4bd8" stroke-width="3" stroke-linejoin="round" points="${d.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>${d.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="#2f4bd8"/><text x="${X(i)}" y="${Y(x.v)-9}" text-anchor="middle" font-size="11">${x.v}</text><text x="${X(i)}" y="138" text-anchor="middle" font-size="10" fill="#64708a">${x.l}</text>`).join('')}</svg>`}
// ---- istatistik
const stats=(s,t)=>{const w=s.filter(x=>x.date>=mon()),td=s.filter(x=>x.date===today());return{tm:sum(s,x=>x.minutes),tq:sum(s,x=>x.total),wm:sum(w,x=>x.minutes),wq:sum(w,x=>x.total),dm:sum(td,x=>x.minutes),dq:sum(td,x=>x.total),topics:new Set(w.map(x=>x.subject+x.topic.toLowerCase())).size,act:t.filter(x=>x.status!=='done'&&x.status!=='expired').length,done:t.filter(x=>x.status==='done').length,soon:t.filter(x=>x.status!=='done'&&x.status!=='expired'&&x.due<=ago(-3)).length}};
const kpi=(l,v,c='')=>`<div class="card ${c}"><div class="${c?'':'mut'}">${l}</div><div class="big">${v}</div></div>`;
function analytics(d){const s=d.sessions,wk=rng==='week',bs={};s.forEach(x=>bs[x.subject]=(bs[x.subject]||0)+x.minutes);const top=Object.entries(bs).sort((a,b)=>b[1]-a[1]),mx=top[0]?top[0][1]:1;
  const B=wk?[...Array(8)].map((_,i)=>{const a=addD(mon(),-7*(7-i));return{l:dt(a),f:x=>x.date>=a&&x.date<=addD(a,6)}}):[...Array(7)].map((_,i)=>{const a=ago(6-i);return{l:dt(a).split(' ')[0],f:x=>x.date===a}});
  const hm=m=>m>=60?(Math.round(m/6)/10)+'s':m+'dk',per=wk?'Son 8 hafta':'Son 7 gün';
  return`<div class="row"><h2>Analiz</h2><div><button class="btn s ${wk?'g':''}" data-c="rng:day">7 gün</button> <button class="btn s ${wk?'':'g'}" data-c="rng:week">8 hafta</button></div></div><div class="grid g2" style="margin-top:0"><div class="card"><h2>${per} çalışma süresi</h2>${bars(B.map(x=>({l:x.l,v:sum(s.filter(x.f),y=>y.minutes)})),hm)}</div>
  <div class="card"><h2>${per} soru sayısı</h2>${bars(B.map(x=>({l:x.l,v:sum(s.filter(x.f),y=>y.total)})))}</div>
  <div class="card"><h2>Derslere göre çalışma</h2>${top.length?top.map(([k,v])=>`<div class="row"><span>${k}</span><b>${dur(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div><br>`).join(''):empty('Henüz çalışma kaydı yok')}</div>
  <div class="card"><h2>Genel net gelişimi</h2>${line(d.exams.map(e=>({l:dt(e.date),v:e.net})))}</div></div>`}
function growth(d){return`<div class="grid g2">${cfg.subjects.map(su=>`<div class="card"><h2>${su} net gelişimi</h2>${line(d.exams.filter(e=>e.subjects.some(r=>r.subject===su)).map(e=>({l:dt(e.date),v:e.subjects.find(r=>r.subject===su).net})))}</div>`).join('')}</div>`}
const sessTable=(s,edit)=>s.length?tbl(['Tarih','Ders','Konu','Süre','Soru','D/Y/B',''],s.map(x=>tr([dt(x.date),x.subject,esc(x.topic),dur(x.minutes),x.total,`${x.correct}/${x.wrong}/${x.blank}`,edit?`<button class="btn g s" data-c="editS:${x.id}">Düzenle</button> <button class="btn d s" data-c="delS:${x.id}">Sil</button>`:''],['Tarih','Ders','Konu','Süre','Soru','D/Y/B','']))):empty('Henüz çalışma kaydın bulunmuyor.','İlk çalışmanı ekleyerek başlayabilirsin.');
const taskTable=(t,mode)=>t.length?tbl(['Ders','Konu','Soru','Son tarih','Durum',''],t.map(x=>tr([x.subject,esc(x.topic),x.questions,dt(x.due),mode==='s'&&x.status!=='expired'?`<select data-st="${x.id}">${['pending','in_progress','done'].map(k=>`<option value="${k}" ${x.status===k?'selected':''}>${ST[k]}</option>`).join('')}</select>`:tag(x.status),mode==='c'?`<button class="btn d s" data-c="delT:${x.id}">Sil</button>`:''],['Ders','Konu','Soru','Son tarih','Durum','']))):empty('Henüz görev bulunmuyor.');
const examCards=(ex,del)=>ex.length?ex.slice().reverse().map(e=>`<div class="card" style="margin-bottom:1rem"><div class="row"><h2>${esc(e.name)} <span class="mut">${dt(e.date)}</span></h2><div><b>Toplam net: ${e.net}</b> ${del?`<button class="btn d s" data-c="delE:${e.id}">Sil</button>`:''}</div></div>${tbl(['Ders','Doğru','Yanlış','Boş','Net'],e.subjects.map(r=>tr([r.subject,r.correct,r.wrong,r.blank,r.net],['Ders','Doğru','Yanlış','Boş','Net'])))}</div>`).join(''):empty('Henüz deneme sonucu yok.','İlk denemeni ekleyerek başlayabilirsin.');
// ---- görünümler
const NAV={student:[['','Ana Sayfa'],['sessions','Çalışmalarım'],['tasks','Görevlerim'],['exams','Denemelerim'],['growth','Gelişimim'],['profile','Profil']],coach:[['','Ana Sayfa'],['students','Öğrencilerim'],['tasks','Görevler'],['exams','Denemeler'],['invites','Davetler'],['profile','Profil']]};
const head=(t,b='')=>`<div class="row"><h1>${t}</h1><div>${b}</div></div>`;
const V={
 async student(r){const d=D,st=stats(d.sessions,d.tasks);
  if(r==='')return head('Merhaba, '+esc(me.first))+(me.coach?'':`<div class="card">Henüz bir koça bağlı değilsin. Koçuna Öğrenci ID'ni (<b>${me.code}</b>) ver; davetini <a href="#/profile">Profil</a> sayfanda göreceksin.</div>`)+await invBox()+`<h2 style="margin-top:1.2rem">Bugün</h2><div class="grid g4">${kpi('Çalışma',dur(st.dm),'p')}${kpi('Çözülen soru',st.dq)}${kpi('Aktif görev',st.act)}${kpi('Tamamlanan görev',st.done)}</div><h2>Bu hafta</h2><div class="grid g4">${kpi('Çalışma',dur(st.wm))}${kpi('Soru',st.wq)}${kpi('Farklı konu',st.topics)}${kpi('Görev tamamlama',st.done+'/'+d.tasks.length)}</div>`+analytics(d);
  if(r==='sessions')return head('Çalışmalarım','<button class="btn" data-c="addS">Çalışma Ekle</button>')+`<div class="card">${sessTable(d.sessions,1)}</div>`;
  if(r==='tasks')return head('Görevlerim')+`<div class="card">${taskTable(d.tasks,'s')}</div>`;
  if(r==='exams')return head('Denemelerim','<button class="btn" data-c="addE">Deneme Ekle</button>')+examCards(d.exams,1);
  if(r==='growth')return head('Gelişimim')+`<div class="card"><h2>Genel net</h2>${line(d.exams.map(e=>({l:dt(e.date),v:e.net})))}</div>`+growth(d);
  if(r==='profile')return head('Profil')+`<div class="card"><p><b>${esc(me.first)} ${esc(me.last)}</b><br>${esc(me.email)}</p><p>Öğrenci ID: <b>${me.code}</b><br>Koçun: ${me.coach?esc(me.coach):'Henüz yok'}</p></div>`+await invBox()},
 async coach(r){
  if(r==='invites'){const v=await api('/invites');return head('Davetler')+`<div class="card"><form data-f="invite" class="row" style="align-items:end"><label style="flex:1;margin:0">Öğrenci ID<input name="code" placeholder="OGR-482731" required></label><button class="btn">Davet Gönder</button></form><div id="msg"></div></div><div class="card" style="margin-top:1rem">${v.length?tbl(['Öğrenci','ID','Tarih','Durum'],v.map(x=>tr([esc(x.first+' '+x.last),x.code,dt(x.created),{pending:'Bekliyor',accepted:'Kabul edildi',rejected:'Reddedildi',ended:'Koçluk sonlandı'}[x.status]],['Öğrenci','ID','Tarih','Durum']))):empty('Henüz davet göndermedin.')}</div>`}
  if(r==='profile')return head('Profil')+`<div class="card"><b>${esc(me.first)} ${esc(me.last)}</b><br>${esc(me.email)}</div>`;
  const L=D;
  if(r.startsWith('s/')){const d=L.find(x=>x.student.id==r.slice(2));if(!d)return empty('Öğrenci bulunamadı.');const st=stats(d.sessions,d.tasks),tp={};d.sessions.forEach(x=>{const k=x.subject+' · '+x.topic;tp[k]=(tp[k]||0)+x.minutes});
   return head(esc(d.student.first+' '+d.student.last),'<a class="btn g" href="#/students">Geri</a> <button class="btn d" data-c="rmSt:'+d.student.id+'">Koçluktan Çıkar</button>')+`<p class="mut">${d.student.code}</p><div class="grid g4">${kpi('Toplam çalışma',dur(st.tm))}${kpi('Bu hafta',dur(st.wm))}${kpi('Toplam soru',st.tq)}${kpi('Bu hafta soru',st.wq)}${kpi('Aktif görev',st.act)}${kpi('Tamamlanan',st.done)}</div>`+analytics(d)+`<div class="card"><h2>Son çalışmalar</h2>${sessTable(d.sessions.slice(0,10))}</div><div class="grid g2"><div class="card"><h2>Konu takibi</h2>${Object.keys(tp).length?Object.entries(tp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${dur(v)}</b></div>`).join(''):empty('Henüz konu yok')}</div><div class="card"><h2>Görevler</h2>${taskTable(d.tasks)}</div></div><h2>Deneme sonuçları</h2>`+examCards(d.exams)+'<h2>Ders bazlı net gelişimi</h2>'+growth(d)}
  if(r==='students'||r==='')return head(r?'Öğrencilerim':'Merhaba, '+esc(me.first),'<button class="btn" data-c="addSt">Öğrenci Ekle</button>')+(r===''?`<div class="grid g4">${kpi('Öğrenci',L.length,'p')}${kpi('Aktif görev',sum(L,x=>stats(x.sessions,x.tasks).act))}${kpi('Tamamlanan',sum(L,x=>stats(x.sessions,x.tasks).done))}${kpi('Süresi yaklaşan',sum(L,x=>stats(x.sessions,x.tasks).soon))}</div>`:'')+`<div class="card">${L.length?tbl(['Öğrenci','ID','Son çalışma','Hafta süre','Hafta soru','Aktif görev',''],L.map(x=>{const s=stats(x.sessions,x.tasks),h=['Öğrenci','ID','Son çalışma','Hafta süre','Hafta soru','Aktif görev',''];return tr([`<b>${esc(x.student.first+' '+x.student.last)}</b>`,x.student.code,x.sessions[0]?dt(x.sessions[0].date):'—',dur(s.wm),s.wq,s.act,`<button class="btn d s" data-c="rmSt:${x.student.id}">Çıkar</button>`],h,`class="l" data-go="s/${x.student.id}"`)})):empty('Henüz sana bağlı bir öğrenci bulunmuyor.','Yukarıdaki Öğrenci Ekle düğmesiyle Öğrenci ID girerek davet gönder.')}</div>`;
  if(r==='tasks')return head('Görevler','<button class="btn" data-c="addT">Görev Oluştur</button>')+`<div class="card">${(()=>{const t=L.flatMap(x=>x.tasks.map(y=>({...y,topic:y.topic+' ('+x.student.first+')'})));return taskTable(t,'c')})()}</div>`;
  if(r==='exams')return head('Denemeler')+(L.flatMap(x=>x.exams.map(e=>({...e,name:x.student.first+' '+x.student.last+' — '+e.name}))).sort((a,b)=>b.date.localeCompare(a.date)).length?examCards(L.flatMap(x=>x.exams.map(e=>({...e,name:x.student.first+' '+x.student.last+' — '+e.name}))).sort((a,b)=>a.date.localeCompare(b.date))):empty('Henüz deneme sonucu yok.'))}};
async function invBox(){if(me.role!=='student'||me.coach)return'';const v=await api('/invites');return v.map(i=>`<div class="card row" style="margin:1rem 0"><span><b>${esc(i.first+' '+i.last)}</b> seni koçluğuna davet ediyor.</span><span><button class="btn" data-c="acc:${i.id}">Kabul Et</button> <button class="btn g" data-c="rej:${i.id}">Reddet</button></span></div>`).join('')}
async function paint(my){const r=location.hash.replace(/^#\//,'');const nav=NAV[me.role];
  let body;try{body=await V[me.role](r)}catch(e){if(/giriş/.test(e.message)){me=null;return authView()}body=`<div class="err">${esc(e.message)}</div>`}
  if(my!==seq)return;const act=r.startsWith('s/')?'students':r,same=lastHash===location.hash,y=scrollY;lastHash=location.hash;
  app.innerHTML=`<div class="shell"><nav id="nav"><b>Koçluk Takip</b>${nav.map(([k,l])=>`<a href="#/${k}" class="${k===act?'on':''}">${l}</a>`).join('')}<span class="sp"></span><a href="#" data-c="out">Çıkış yap</a></nav><main><div class="top"><button class="btn g" data-c="menu" aria-label="Menü">☰</button><b>Koçluk Takip</b></div>${body}</main></div>`}
// Önce önbellekteki veriyle anında çizer, sonra güncel veriyi çekip değiştiyse yeniden çizer.
async function render(){if(!me)return authView();const my=++seq;let ok=false;
  if(cache){D=cache;ok=true;await paint(my)}
  try{const old=JSON.stringify([cache,me.coach]),[c,m]=await Promise.all([api(me.role==='student'?'/students/me':'/students'),me.role==='student'?api('/me'):0]);cache=c;if(m)me=m;D=cache;if(my!==seq)return;if(!ok||JSON.stringify([cache,me.coach])!==old)await paint(my)}
  catch(e){if(/giriş/.test(e.message)){me=null;cache=null;return authView()}if(!ok&&my===seq)app.innerHTML=`<main style="margin:0"><div class="err">${esc(e.message)}</div></main>`}}
const reload=()=>{cache=null;return render()};
function authView(m='login',e=''){app.innerHTML=`<div class="auth"><h1>Koçluk Takip</h1><p class="mut">Çalışma sürecini ve gelişimi takip et.</p><div class="card"><div class="tabs"><button class="btn ${m==='login'?'':'g'}" data-c="tab:login">Giriş</button><button class="btn ${m==='reg'?'':'g'}" data-c="tab:reg">Kayıt ol</button></div>${e?`<div class="err">${esc(e)}</div>`:''}<form data-f="${m}">${m==='reg'?`<label>Hesap türü<select name="role"><option value="student">Öğrenci</option><option value="coach">Koç / Öğretmen</option></select></label><div class="f2"><label>Ad<input name="first" required></label><label>Soyad<input name="last" required></label></div>`:''}<label>E-posta<input name="email" type="email" required></label><label>Şifre${m==='reg'?' (en az 8 karakter)':''}<input name="password" type="password" required minlength="${m==='reg'?8:1}"></label><button class="btn" style="width:100%">${m==='reg'?'Hesap oluştur':'Giriş yap'}</button></form></div></div>`}
// ---- diyaloglar
const num=(n,l,v='')=>`<label>${l}<input name="${n}" type="number" min="0" value="${v}" required></label>`,opts=(a,s)=>a.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
function modal(h){dlg.innerHTML=`<div id="dm"></div>${h}<div class="row" style="margin-top:.5rem"><span></span><button class="btn g" type="button" data-c="close">Vazgeç</button></div>`;dlg.showModal()}
const sForm=(x={})=>`<h2>${x.id?'Çalışmayı düzenle':'Çalışma ekle'}</h2><form data-f="sess" data-id="${x.id||''}"><div class="f2"><label>Ders<select name="subject">${opts(cfg.subjects,x.subject)}</select></label><label>Tarih<input name="date" type="date" value="${x.date||today()}" max="${today()}" required></label></div><label>Konu<input name="topic" value="${esc(x.topic||'')}" required></label><div class="f2">${num('hours','Saat',x.minutes?Math.floor(x.minutes/60):0)}${num('mins','Dakika',x.minutes?x.minutes%60:0)}</div><div class="f2">${num('total','Çözülen soru',x.total)}${num('correct','Doğru',x.correct)}${num('wrong','Yanlış',x.wrong)}${num('blank','Boş',x.blank)}</div><button class="btn">Kaydet</button></form>`;
const acts={
 login:async(f,b)=>{me=await api('/login','POST',b);await fin()},
 reg:async(f,b)=>{me=await api('/register','POST',b);await fin()},
 invite:async(f,b)=>{await api('/invites','POST',b);reload()},
 sess:async(f,b)=>{await api('/sessions'+(f.dataset.id?'/'+f.dataset.id:''),f.dataset.id?'PUT':'POST',b);dlg.close();reload()},
 exam:async(f,b)=>{const subjects=cfg.subjects.map((s,i)=>({subject:s,correct:b['c'+i],wrong:b['w'+i],blank:b['b'+i]}));await api('/exams','POST',{name:b.name,date:b.date,subjects});dlg.close();reload()},
 stinv:async(f,b)=>{await api('/invites','POST',b);dlg.close();alert('Davet gönderildi. Öğrenci kabul edince listende görünür.')},
 task:async(f,b)=>{await api('/tasks','POST',b);dlg.close();reload()}};
async function fin(){if(me.role==='student'){me=await api('/me')}location.hash='#/';reload()}
const clicks={
 out:async()=>{await api('/logout','POST');me=null;cache=null;authView()},rng:m=>{rng=m;paint(++seq)},menu:()=>$('#nav').classList.toggle('open'),close:()=>dlg.close(),
 tab:m=>authView(m),acc:async id=>{try{await api('/invites/'+id+'/respond','POST',{accept:true});me=await api('/me')}catch(e){alert(e.message)}reload()},rej:async id=>{await api('/invites/'+id+'/respond','POST',{accept:false});reload()},
 addS:()=>modal(sForm()),editS:id=>modal(sForm(D.sessions.find(x=>x.id==id))),delS:async id=>{if(confirm('Bu çalışma kaydı silinsin mi?')){await api('/sessions/'+id,'DELETE');reload()}},
 delT:async id=>{if(confirm('Bu görev silinsin mi?')){await api('/tasks/'+id,'DELETE');reload()}},delE:async id=>{if(confirm('Bu deneme silinsin mi?')){await api('/exams/'+id,'DELETE');reload()}},
 addE:()=>modal(`<h2>Deneme ekle</h2><form data-f="exam"><div class="f2"><label>Deneme adı<input name="name" placeholder="TYT Deneme 1" required></label><label>Tarih<input name="date" type="date" value="${today()}" max="${today()}" required></label></div><p class="mut">Girmediğin dersleri boş bırak. Net = doğru − yanlış/4</p>${cfg.subjects.map((s,i)=>`<b>${s}</b><div class="f3"><label>Doğru<input name="c${i}" type="number" min="0"></label><label>Yanlış<input name="w${i}" type="number" min="0"></label><label>Boş<input name="b${i}" type="number" min="0"></label></div>`).join('')}<button class="btn">Kaydet</button></form>`),
 rmSt:async id=>{if(confirm('Bu öğrenci koçluğundan çıkarılsın mı?\nBu koç olarak verdiğin görevler silinir. Öğrencinin çalışma ve deneme kayıtları öğrencide kalır.')){try{await api('/students/'+id,'DELETE');if(location.hash.startsWith('#/s/'))location.hash='#/students';reload()}catch(e){alert(e.message)}}},
 addSt:()=>modal(`<h2>Öğrenci ekle</h2><p class="mut">Öğrencinin Öğrenci ID'sini yaz. Öğrenci daveti kabul edince listene eklenir.</p><form data-f="stinv"><label>Öğrenci ID<input name="code" placeholder="OGR-482731" required></label><button class="btn">Davet Gönder</button></form>`),
 addT:()=>D.length?modal(`<h2>Görev oluştur</h2><form data-f="task"><label>Öğrenci<select name="student_id">${D.map(x=>`<option value="${x.student.id}">${esc(x.student.first+' '+x.student.last)}</option>`).join('')}</select></label><div class="f2"><label>Ders<select name="subject">${opts(cfg.subjects)}</select></label><label>Son tarih<input name="due" type="date" min="${today()}" required></label></div><label>Konu<input name="topic" required></label>${num('questions','Soru sayısı')}<button class="btn">Görev ver</button></form>`):alert('Önce bir öğrenci bağlamalısın.')};
document.addEventListener('click',e=>{const t=e.target.closest('[data-c],[data-go]');if(!t)return;e.preventDefault();if(t.dataset.go)return location.hash='#/'+t.dataset.go;const[k,a]=t.dataset.c.split(':');clicks[k](a)});
document.addEventListener('change',async e=>{if(e.target.dataset.st){try{await api('/tasks/'+e.target.dataset.st,'PATCH',{status:e.target.value})}catch(x){alert(x.message)}reload()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.f)return;e.preventDefault();const b=Object.fromEntries(new FormData(f));try{await acts[f.dataset.f==='invite'?'invite':f.dataset.f](f,b)}catch(x){const m=f.closest('dialog')?$('#dm'):$('#msg');if(m)m.innerHTML=`<div class="err">${esc(x.message)}</div>`;else if(!me)authView(f.dataset.f,x.message)}});
window.addEventListener('hashchange',()=>{render()});
(async()=>{cfg=await api('/config');try{me=await api('/me')}catch{me=null}render()})();
</script></body></html>
